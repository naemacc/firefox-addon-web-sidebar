name: CI

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Lint extension
        run: bunx web-ext lint

      - name: Build extension zip
        run: bunx web-ext build

      - name: Upload zip
        uses: actions/upload-artifact@v6
        with:
          name: extension-zip
          path: web-ext-artifacts/*.zip
